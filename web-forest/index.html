<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/magi/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3E9A4A" />
    <!-- Critical boot paint. The app is one ~700 kB script, and until it runs
         the page was an empty white root, so every cold start opened on white.
         This paints the boot scene's sky and the splash lockup at the exact
         spot boot.tsx draws them, so React takes over without a visible seam.
         Keep the colours in step with --bt-scene in src/boot.css. -->
    <style>
      html:has(#bt-pre) { background: #cdebff; }
      #bt-pre {
        position: fixed; inset: 0; z-index: 200;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9vh;
        background: linear-gradient(180deg, #9fd3f6 0%, #cdebff 55%, #eaf7fe 100%);
        font-family: "Nunito", system-ui, sans-serif;
      }
      #bt-pre img { width: min(78vw, 420px); height: auto; aspect-ratio: 714 / 330; animation: bt-pre-in 700ms ease both; }
      #bt-pre p { margin: 0; height: 38px; }
      @keyframes bt-pre-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #bt-pre img { animation: none; } }
    </style>
    <meta
      name="description"
      content="Magisphere — Ateneo Loyola Heights. A student-led campus-forest walk: find what is out right now, log it, learn it. Youth CLAP 2026 · Ateneo CCC."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Magisphere" />
    <title>Magisphere · Ateneo Loyola Heights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400&family=Nunito:wght@700;800;900&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><div id="bt-pre" aria-label="Magisphere"><img src="/brand/magi/lockup-stacked.svg" alt="Magisphere — Rediscovering home." /><p aria-hidden="true"></p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
