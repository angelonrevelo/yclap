<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img">
<title>Agila the Blue Eagle, perched</title>
<defs><filter id="pet-edge-perch" x="-20%" y="-20%" width="140%" height="140%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="3.5" result="grow"/>
  <feFlood flood-color="#fff"/><feComposite in2="grow" operator="in" result="edge"/>
  <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<g filter="url(#pet-edge-perch)" stroke="#0E3B2A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- tail -->
  <path d="M40,88 L26,108 L38,106 L42,112 L52,96 Z" fill="#24478A"/>
  <!-- body -->
  <path d="M36,62 C34,44 50,34 64,38 C80,42 86,60 80,78 C76,92 60,98 48,94 C38,90 37,76 36,62 Z" fill="#3463B5"/>
  <!-- belly -->
  <path d="M60,60 C72,62 78,72 74,84 C70,92 60,94 54,90 C60,82 62,70 60,60 Z" fill="#5B86D6" stroke="none"/>
  <!-- folded wing -->
  <path d="M40,56 C50,50 62,56 64,70 C66,82 58,94 44,98 C46,86 40,72 40,56 Z" fill="#24478A"/>
  <path d="M46,76 L56,74 M46,84 L56,82" fill="none" stroke-width="2.5"/>
  <!-- head -->
  <path d="M52,40 C50,24 62,14 76,16 C90,18 96,30 92,40 C88,48 76,50 66,48 C58,46 53,44 52,40 Z" fill="#FFF6DC"/>
  <!-- brow -->
  <path d="M73,25 Q79,23 86,24" fill="none" stroke-width="2.5"/>
  <!-- eye -->
  <circle cx="80" cy="31" r="4" fill="#0E3B2A" stroke="none"/>
  <circle cx="81.4" cy="29.6" r="1.4" fill="#fff" stroke="none"/>
  <!-- beak -->
  <path d="M90,30 C98,30 104,34 102,42 C100,40 96,39 92,40 C90,37 89,33 90,30 Z" fill="#F5B82E"/>
  <!-- feet -->
  <path d="M54,94 L52,104 M52,104 L46,106 M52,104 L56,107 M66,92 L66,104 M66,104 L60,106 M66,104 L71,107" fill="none" stroke="#C98A12" stroke-width="3"/>
  <!-- branch -->
  <path d="M22,106 C44,103 70,104 100,108" fill="none" stroke="#7A4B2A" stroke-width="5"/>
</g>
</svg>
